# Config propia sobre la config por defecto de detekt (buildUponDefaultConfig = true).
# Solo se listan las reglas que se ajustan respecto al default; el resto queda tal cual.
# Los hallazgos existentes al día de hoy están suprimidos vía baseline.xml — estas reglas
# aplican de lleno a partir de ahora, para código nuevo o modificado.

style:
  MagicNumber:
    active: false # muy ruidoso en Compose (dp, sp, colores, tamaños de fuente por todos lados)

complexity:
  LongMethod:
    threshold: 150 # los Composables de pantalla completa suelen superar el default de 60
  LongParameterList:
    ignoreAnnotated: ['Composable', 'Inject'] # constructores @Inject de ViewModel inyectan
                                              # un use case por responsabilidad (Clean Architecture) —
                                              # agrupar parámetros ahí sería artificial
    functionThreshold: 8
    constructorThreshold: 8
  TooManyFunctions:
    ignoreAnnotated: ['Composable']
    thresholdInFiles: 20 # ignoreAnnotated no cubre el conteo a nivel de archivo — pantallas con
                         # muchos Composables privados pequeños (uno por tipo de documento) superan
                         # el default de 11 sin que eso implique demasiadas responsabilidades reales
    thresholdInClasses: 15 # managers que trackean varios tipos de recurso en paralelo (ej.
                           # DailyLimitManager: conversiones + 4 herramientas PDF) acumulan
                           # funciones pequeñas y cohesivas, no responsabilidades mezcladas
  CyclomaticComplexMethod:
    ignoreAnnotated: ['Composable']

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # nombres PascalCase de funciones @Composable

potential-bugs:
  active: true
