name: Publicar página legal (GitHub Pages)

# Publica SOLO la carpeta legal/ (política de privacidad) — no docs/, que
# tiene specs internas de requerimientos que no deben quedar como sitio
# público. Requiere activar Pages una vez en Settings → Pages → Source:
# "GitHub Actions" (no "Deploy from a branch").

on:
  push:
    branches: [ main ]
    paths:
      - 'legal/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy a GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preparar artefacto de Pages
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: legal

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
