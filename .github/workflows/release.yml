name: Release

# Construye y firma el AAB de release en cada tag de versión (v*), y lo deja
# como artefacto descargable de este workflow. No publica a Play Console
# todavía: la primera subida de una app nueva tiene que ser manual desde la
# consola web (Google no lo permite por API) — una vez hecha esa primera
# subida y creada una cuenta de servicio en Play Console, este workflow es
# el punto de partida para agregar el paso de publicación automática
# (Gradle Play Publisher).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-signed-bundle:
    name: Construir y firmar AAB de release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      # Los secrets se pasan por `env:` y se referencian como variables de
      # shell ($VAR), no interpolados directamente en el texto del script
      # (${{ secrets.X }}) -- GitHub sustituye ese texto de forma literal
      # antes de que el shell lo vea, así que un valor con comillas/backticks/
      # `$()` se ejecutaría como parte del script en vez de tratarse como un
      # dato opaco (hallazgo real de SonarCloud: "Avoid expanding secrets in
      # a run block").
      - name: Preparar firma de release desde secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > keystore/docsmart-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/docsmart-release.jks
          storePassword=$RELEASE_KEYSTORE_PASSWORD
          keyAlias=$RELEASE_KEY_ALIAS
          keyPassword=$RELEASE_KEY_PASSWORD
          EOF

      - name: Construir AAB firmado
        run: ./gradlew bundleRelease --no-daemon

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f keystore/docsmart-release.jks keystore.properties

      - name: Publicar AAB como artefacto
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: app-release-${{ github.ref_name }}
          retention-days: 90
          path: app/build/outputs/bundle/release/app-release.aab
