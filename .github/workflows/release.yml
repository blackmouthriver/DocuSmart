name: Release

# Construye y firma el AAB de release en cada tag de versión (v*), y lo deja
# como artefacto descargable de este workflow. No publica a Play Console
# todavía: la primera subida de una app nueva tiene que ser manual desde la
# consola web (Google no lo permite por API) — una vez hecha esa primera
# subida y creada una cuenta de servicio en Play Console, este workflow es
# el punto de partida para agregar el paso de publicación automática
# (Gradle Play Publisher).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-signed-bundle:
    name: Construir y firmar AAB de release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      - name: Preparar firma de release desde secrets
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > keystore/docsmart-release.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/docsmart-release.jks
          storePassword=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Construir AAB firmado
        run: ./gradlew bundleRelease --no-daemon

      - name: Borrar el keystore del runner
        if: always()
        run: rm -f keystore/docsmart-release.jks keystore.properties

      - name: Publicar AAB como artefacto
        uses: actions/upload-artifact@v7
        with:
          name: app-release-${{ github.ref_name }}
          retention-days: 90
          path: app/build/outputs/bundle/release/app-release.aab
