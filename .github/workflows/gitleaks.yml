name: Gitleaks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Escaneo de secretos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Se usa el binario de gitleaks directamente (Apache-2.0, sin licencia
      # ni cuenta externa) en vez de la Action del marketplace, para evitar
      # cualquier dependencia de licenciamiento en repos privados/de organización.
      # `--proto '=https'` evita que `-L` (seguir redirecciones) termine
      # siguiendo una redirección a http:// si el servidor alguna vez
      # respondiera con una -- hallazgo real de SonarCloud ("Not enforcing
      # HTTPS here might allow for redirections to insecure websites").
      #
      # Versión FIJA (2026-10-03): antes se resolvía "la última" consultando la API
      # de GitHub sin autenticar en cada corrida -- esa consulta falló una vez
      # (error pasajero, el escaneo ni llegó a correr y el check quedó en rojo en
      # main) y además una versión nueva podía cambiar reglas sin aviso. El
      # SHA-256 es el oficial de gitleaks_8.30.1_checksums.txt del release; para
      # actualizar: cambiar VERSION y el hash juntos desde ese archivo.
      - name: Descargar gitleaks
        run: |
          set -euo pipefail
          VERSION=8.30.1
          SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl --proto '=https' --tlsv1.2 -fsSL --retry 3 --retry-delay 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      - name: Escanear repositorio
        run: |
          ./gitleaks detect \
            --source . \
            --redact \
            --report-format sarif \
            --report-path gitleaks-report.sarif \
            --verbose

      - name: Publicar reporte
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: gitleaks-report
          retention-days: 14
          path: gitleaks-report.sarif
          if-no-files-found: ignore
