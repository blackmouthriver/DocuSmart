name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ronda 21 (rehecho): con ~638 pruebas este job venía terminando CANCELLED
  # por timeout (probado con 60 y con 100 minutos, ambos insuficientes) antes
  # de llegar a la tarea `sonar` -- SonarCloud se quedaba sin analizar el
  # commit (el análisis saltaba directo al anterior). En vez de seguir
  # subiendo el timeout de un solo job secuencial, se divide
  # connectedDebugAndroidTest en 4 "shards" que corren EN PARALELO en 4
  # máquinas de GitHub Actions (sharding nativo de AndroidJUnitRunner:
  # numShards/shardIndex reparten los tests por hash determinístico de
  # className#methodName, sin duplicados ni huecos), y un job final junta la
  # cobertura de los 4 y recién ahí sube a SonarCloud. El tiempo de pared baja
  # a ~1/4 del de un solo job (cada shard sigue teniendo su propio arranque
  # de emulador, así que no es exactamente 4x, pero sí varias veces más
  # rápido).
  instrumented-shard:
    name: Compose UI Testing (shard ${{ matrix.shardIndex }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [0, 1, 2, 3]
    steps:
      # Mismo motivo documentado en ci.yml/versión anterior de este archivo:
      # ubuntu-latest no trae suficiente espacio libre de fábrica para este
      # build (iText7 + Apache POI + AVD) -- debe ir antes de instalar
      # JDK/Gradle/SDK, con tool-cache:false y android:false (el job
      # necesita el SDK de Android preinstalado para compilar y correr el
      # emulador).
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # fetch-depth 1 (no 0): a diferencia del job de agregación, un shard no
      # corre Sonar ni necesita el historial completo para blame.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      # Compilar ANTES de arrancar el emulador -- el runner solo tiene 2 vCPU,
      # compilar con el emulador ya corriendo compite por los mismos núcleos.
      - name: Compilar APKs de debug y de test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      # KVM da aceleración por hardware al emulador -- sin esto corre por
      # software y es demasiado lento para un job de CI.
      - name: Habilitar permisos de grupo KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Misma clave que ci.yml (para compartir caché entre workflows) --
      # target: aosp_atd, ver el comentario extenso en ci.yml (hallazgo real
      # 2026-09-01: connectedDebugAndroidTest fallaba de forma sistemática
      # con google_apis por contención de CPU con SystemUI/GMS de fondo en
      # el runner de 2 vCPU). Los 4 shards leen la misma clave en paralelo
      # (solo lectura si ya existe, sin conflicto real entre ellos).
      - name: Cache de AVD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-aosp_atd-x86_64

      - name: Crear snapshot de AVD (si no hay caché)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot de AVD generado"

      # Solo connectedDebugAndroidTest (ni jacocoTestReport ni sonar): el
      # job de agregación junta los 4 .ec y recién ahí corre esas tareas.
      # numShards/shardIndex via -P se suman a testInstrumentationRunnerArguments
      # (ya trae "listener" desde app/build.gradle.kts, AGP fusiona ambos).
      # ignoreFailures=true ya está puesto de forma global en
      # app/build.gradle.kts (DeviceProviderInstrumentTestTask) -- mismo
      # motivo documentado ahí: ~14-16 pruebas fallan solo en este emulador
      # compartido (ver docs/requirements/deployment.md §3), no debe tumbar
      # el job.
      - name: Pruebas instrumentadas (este shard)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        continue-on-error: true
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -camera-back none
          script: >
            ./gradlew connectedDebugAndroidTest --no-daemon --continue
            -Pandroid.testInstrumentationRunnerArguments.numShards=4
            -Pandroid.testInstrumentationRunnerArguments.shardIndex=${{ matrix.shardIndex }}

      # Cada shard puede terminar con un .ec bajo un nombre de dispositivo
      # igual al de los otros shards (mismo AVD) -- se renombra por shard
      # ANTES de subir el artefacto para que el job de agregación pueda
      # combinar los 4 sin que ninguno pise a otro.
      - name: Preparar cobertura de este shard para subir
        if: always()
        run: |
          mkdir -p "coverage-shard-${{ matrix.shardIndex }}"
          find app/build/outputs/code_coverage/debugAndroidTest/connected -name '*.ec' \
            -exec cp {} "coverage-shard-${{ matrix.shardIndex }}/coverage.ec" \; || true

      - name: Publicar cobertura de este shard
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-shard-${{ matrix.shardIndex }}
          retention-days: 1
          path: coverage-shard-${{ matrix.shardIndex }}/
          if-no-files-found: warn

      - name: Publicar reporte de pruebas instrumentadas (este shard)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reporte-compose-ui-testing-shard-${{ matrix.shardIndex }}
          retention-days: 14
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore

  sonar:
    name: Análisis de calidad (SonarCloud)
    needs: instrumented-shard
    # Corre aunque algún shard haya fallado del todo (emulador que no
    # arrancó, timeout, etc.) -- mismo espíritu que continue-on-error en la
    # versión anterior de este archivo: mejor subir a Sonar con la cobertura
    # que sí haya (3 de 4 shards, unit tests) que no subir nada.
    if: always()
    runs-on: ubuntu-latest
    # Ya no corre el emulador (eso lo hacen los 4 shards de arriba, en
    # paralelo) -- solo compila, corre los unit tests JVM (rápido, sin
    # dispositivo), junta la cobertura de los 4 shards y sube a Sonar.
    timeout-minutes: 30
    steps:
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # fetch-depth 0 acá sí, a diferencia de los shards -- Sonar necesita
      # el historial completo para blame/autoría por línea.
      - name: Checkout (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      - name: Compilar APKs de debug y de test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      # Descarga los 4 artefactos coverage-shard-0..3, cada uno en su propia
      # subcarpeta (merge-multiple:false) -- ya vienen con el .ec renombrado
      # sin colisión entre shards (paso "Preparar cobertura" de arriba).
      # continue-on-error: si un shard falló del todo y nunca llegó a subir
      # su artefacto, que siga el resto en vez de tumbar el job entero.
      - name: Descargar cobertura de los 4 shards
        continue-on-error: true
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v8.0.1
        with:
          pattern: coverage-shard-*
          path: coverage-shards/
          merge-multiple: false

      # Copia cada .ec descargado a la ruta donde jacocoTestReport los busca
      # (glob "outputs/code_coverage/debugAndroidTest/connected/**/*.ec" en
      # app/build.gradle.kts) -- una subcarpeta por shard, ya sin colisión.
      # nullglob: si ningún shard llegó a subir su cobertura, el for no
      # itera sobre el patrón literal (sin esto, un glob sin coincidencias
      # se pasa tal cual como texto y el resto del loop falla).
      - name: Colocar la cobertura de los shards donde la espera jacocoTestReport
        run: |
          shopt -s nullglob
          for d in coverage-shards/coverage-shard-*/; do
            shard=$(basename "$d")
            mkdir -p "app/build/outputs/code_coverage/debugAndroidTest/connected/$shard"
            find "$d" -name '*.ec' -exec cp {} "app/build/outputs/code_coverage/debugAndroidTest/connected/$shard/coverage.ec" \;
          done
          find app/build/outputs/code_coverage/debugAndroidTest/connected -name '*.ec'

      # testDebugUnitTest corre real acá (rápido, sin dispositivo).
      # -x connectedDebugAndroidTest: esa tarea ya corrió en los 4 shards;
      # jacocoTestReport solo necesita los .ec que acabamos de colocar, no
      # que la tarea se ejecute de nuevo (fallaría, no hay emulador acá).
      # --continue: mismo motivo que la versión anterior de este archivo --
      # si algo en testDebugUnitTest fallara, que `sonar` corra igual con la
      # cobertura que haya en disco en ese momento.
      - name: Cobertura (unit + Compose UI Testing) + análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jacocoTestReport sonar --no-daemon --continue -x connectedDebugAndroidTest

      - name: Publicar reporte de cobertura fusionado
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reporte-cobertura-jacoco-sonar
          retention-days: 14
          path: app/build/reports/jacoco/jacocoTestReport/
          if-no-files-found: ignore
