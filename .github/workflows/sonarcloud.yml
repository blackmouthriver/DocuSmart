name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Análisis de calidad (SonarCloud)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (historial completo)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache SonarCloud
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      # jacocoTestReport corre los unit tests y genera el XML de cobertura;
      # sonar lo lee vía sonar.coverage.jacoco.xmlReportPaths (build.gradle.kts raíz).
      - name: Cobertura + análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew jacocoTestReport sonar --no-daemon
