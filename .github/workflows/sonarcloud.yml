name: SonarCloud

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: Análisis de calidad (SonarCloud)
    runs-on: ubuntu-latest
    # Presupuesto ampliado (antes 30) para cubrir el emulador de Compose UI
    # Testing (ci.yml le da 40 min solo a esa parte) sumado a la compilación
    # y el análisis de Sonar -- ver docs/requirements/compose-ui-testing.md
    # §4 para el porqué de duplicar el emulador acá en vez de reutilizar el
    # job `instrumented-tests` de ci.yml (workflows separados no comparten
    # jobs sin la complejidad de `workflow_run`).
    timeout-minutes: 60
    steps:
      # Mismo fix ya aplicado en ci.yml (ver deployment.md §3): ubuntu-latest
      # no trae suficiente espacio libre de fábrica para este build (iText7 +
      # Apache POI + caché de Gradle/Sonar) -- sin esto, el job falla a mitad
      # de camino con "No space left on device", y jacocoTestReport nunca
      # termina de generar el XML de cobertura que Sonar necesita. Debe ir
      # antes de instalar JDK/Gradle/SDK (mismo motivo documentado en
      # ci.yml): con tool-cache:false no hay nada en hostedtoolcache que
      # perder, evita depender del orden de pasos para no repetir ese error.
      # android:false a propósito (igual que en ci.yml): este job también
      # necesita el SDK de Android preinstalado para el emulador.
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout (historial completo)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache SonarCloud
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Gradle
        uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      # Compilar ANTES de arrancar el emulador, no durante -- mismo motivo
      # documentado en ci.yml (el runner solo tiene 2 vCPU, compilar con el
      # emulador ya corriendo compite por los mismos núcleos y lo cuelga).
      - name: Compilar APKs de debug y de test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      # KVM da aceleración por hardware al emulador -- sin esto corre por
      # software y es demasiado lento para un job de CI (igual que ci.yml).
      - name: Habilitar permisos de grupo KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Mismo AVD que ci.yml (misma clave, para compartir caché entre ambos
      # workflows) -- target: aosp_atd en vez de google_apis, ver el
      # comentario extenso en ci.yml (hallazgo real 2026-09-01:
      # connectedDebugAndroidTest fallaba de forma sistemática con
      # google_apis por contención de CPU con SystemUI/GMS de fondo en el
      # runner de 2 vCPU).
      - name: Cache de AVD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-aosp_atd-x86_64

      - name: Crear snapshot de AVD (si no hay caché)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot de AVD generado"

      # jacocoTestReport corre testDebugUnitTest + connectedDebugAndroidTest
      # (Compose UI Testing) y fusiona ambos reportes de cobertura en un
      # solo XML (ver app/build.gradle.kts) -- antes solo contaba los unit
      # tests, dejando en 0% la cobertura real de las pruebas de Compose
      # (ver docs/requirements/compose-ui-testing.md §4). connectedDebugAndroidTest
      # necesita el emulador vivo, por eso todo el comando corre dentro del
      # `script` de la acción del emulador, no en un paso aparte. Sonar lee
      # el XML fusionado vía sonar.coverage.jacoco.xmlReportPaths
      # (build.gradle.kts raíz). disable-animations:true replica el mismo
      # mitigante de flakiness que ci.yml.
      # continue-on-error + --continue: 14-15/30 pruebas de Compose UI
      # Testing fallan de forma conocida solo en este emulador de CI (ver
      # docs/requirements/deployment.md §3) -- sin --continue, Gradle
      # aborta todo el build en cuanto connectedDebugAndroidTest falla y
      # la tarea `sonar` (pedida en el mismo comando) NUNCA llega a
      # correr, dejando el análisis de SonarCloud completamente sin
      # actualizar en cada push desde que empezaron esas fallas
      # (confirmado leyendo el log: "Task :sonar" no aparecía en ningún
      # lado). Con --continue, jacocoTestReport se salta (su dependencia
      # connectedDebugAndroidTest falló) pero `sonar` no depende de ella
      # en el grafo de Gradle -- sí corre, con la cobertura que haya en
      # disco en ese momento.
      - name: Cobertura (unit + Compose UI Testing) + análisis SonarCloud
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          api-level: 34
          target: aosp_atd
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -camera-back none
          script: ./gradlew jacocoTestReport sonar --no-daemon --continue

      - name: Publicar reporte de pruebas instrumentadas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reporte-compose-ui-testing-sonar
          retention-days: 14
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
