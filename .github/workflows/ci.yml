name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, lint, detekt y tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      - name: Compilar (debug)
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        run: ./gradlew lintDebug --no-daemon

      - name: detekt (análisis estático)
        run: ./gradlew detekt --no-daemon

      - name: Pruebas unitarias
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reportes-calidad
          retention-days: 14
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/detekt/detekt.html
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

  instrumented-tests:
    name: Compose UI Testing (emulador)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Primer paso a propósito, antes de instalar JDK/Gradle/SDK de Android
      # -- el runner ubuntu-latest no trae suficiente espacio libre para
      # crear la partición userdata del AVD (primer intento real de este
      # job falló con "FATAL | Not enough space to create userdata
      # partition. Available: 6097.70 MB ... need 7372.80 MB", faltaba
      # ~1.3 GB). `android: false` deja intacto el SDK de Android
      # preinstalado -- lo sigue usando el job `build` de este mismo
      # workflow para compilar sin pasos extra, y este job también lo
      # necesita para connectedDebugAndroidTest. `tool-cache: false` (su
      # default) también a propósito -- con true borra
      # $AGENT_TOOLSDIRECTORY (/opt/hostedtoolcache); un segundo intento con
      # este paso corriendo DESPUÉS de "JDK 17" falló porque borraba ahí
      # mismo el JDK que setup-java acababa de instalar, y sdkmanager
      # --licenses ya no encontraba java. Corrido primero, antes de que
      # exista nada en hostedtoolcache que perder, evita depender de este
      # orden de flags para no repetir el mismo error.
      - name: Liberar espacio en disco
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: JDK 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6

      - name: Permiso de ejecución para gradlew
        run: chmod +x ./gradlew

      # Compilar ANTES de arrancar el emulador, no durante -- el runner
      # tiene solo 2 vCPU en total. Tercer intento real falló con el
      # emulador colgado (ERROR | detected a hanging thread 'QEMU2 CPU0
      # thread'/'QEMU2 main loop') justo mientras corría
      # connectedDebugAndroidTest, porque ese script compila Kotlin/dex al
      # vuelo con el emulador ya corriendo, compitiendo por los mismos 2
      # núcleos. Compilando acá, con el emulador todavía apagado,
      # connectedDebugAndroidTest más adelante encuentra casi todo
      # up-to-date y solo necesita instalar los APKs y correr la
      # instrumentación -- mucho más liviano en CPU con el emulador ya
      # activo.
      - name: Compilar APKs de debug y de test
        run: ./gradlew assembleDebug assembleDebugAndroidTest --no-daemon

      # KVM da aceleración por hardware al emulador en los runners Linux
      # hospedados por GitHub -- sin esto el emulador corre por software y
      # es demasiado lento para un job de CI.
      - name: Habilitar permisos de grupo KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 (Android 14) iguala la versión del dispositivo real usado
      # para verificar estos mismos flujos en desarrollo (motorola edge 30
      # neo). x86_64 es la única arquitectura con aceleración KVM en los
      # runners Linux de GitHub (hospedados en x86_64), no arm64-v8a.
      - name: Cache de AVD
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-google_apis-x86_64

      - name: Crear snapshot de AVD (si no hay caché)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot de AVD generado"

      # connectedDebugAndroidTest corre los 3 flujos críticos de Compose UI
      # Testing (abrir documento, conversión, PIN de Carpeta Segura).
      # disable-animations: true replica en el emulador el fix de
      # flakiness encontrado en el dispositivo real (ver
      # docs/requirements/conversion.md §7): con animaciones activas,
      # varias pruebas de Compose seguidas fallan de forma intermitente
      # con "No compose hierarchies found".
      - name: Pruebas instrumentadas (connectedDebugAndroidTest)
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -camera-back none
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Publicar reporte de pruebas instrumentadas
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: reporte-compose-ui-testing
          retention-days: 14
          path: app/build/reports/androidTests/connected/
          if-no-files-found: ignore
